name: tensorrt
on:
  push:
    paths:
      - tensorrt/**
      - .github/workflows/tensorrt.yml
  pull_request:
    paths:
      - tensorrt/**
      - .github/workflows/tensorrt.yml
  workflow_dispatch:
env:
  CI_DEPLOY_NEED_CUDA: 1
  CI_DEPLOY_MODULE: ${{ github.workflow }}
  CI_DEPLOY_PLATFORM: ${{ github.job }}
  CI_DEPLOY_SETTINGS: ${{ secrets.CI_DEPLOY_SETTINGS }}
  CI_DEPLOY_USERNAME: ${{ secrets.CI_DEPLOY_USERNAME }}
  CI_DEPLOY_PASSWORD: ${{ secrets.CI_DEPLOY_PASSWORD }}
  STAGING_REPOSITORY: ${{ secrets.STAGING_REPOSITORY }}
jobs:
  linux-arm64:
    runs-on: ubuntu-22.04-arm
    steps:
      - uses: devjeonghwan/javacpp-presets/.github/actions/deploy-ubuntu@windows-arm64-presets
  linux-x86_64:
    runs-on: ubuntu-22.04
    steps:
      - uses: devjeonghwan/javacpp-presets/.github/actions/deploy-ubuntu@windows-arm64-presets
  windows-arm64:
    runs-on: windows-11-arm
    steps:
      - uses: devjeonghwan/javacpp-presets/.github/actions/deploy-windows@windows-arm64-presets
  windows-x86_64:
    runs-on: windows-2022
    steps:
      - uses: devjeonghwan/javacpp-presets/.github/actions/deploy-windows@windows-arm64-presets
  platform:
    needs: [linux-arm64, linux-x86_64, windows-arm64, windows-x86_64]
    runs-on: ubuntu-22.04
    steps:
      - uses: devjeonghwan/javacpp-presets/.github/actions/redeploy@windows-arm64-presets
