name: openblas
on:
  push:
    paths:
      - openblas/**
      - .github/workflows/openblas.yml
  pull_request:
    paths:
      - openblas/**
      - .github/workflows/openblas.yml
  workflow_dispatch:
env:
  CI_DEPLOY_NEED_GCC: 1
  CI_DEPLOY_MODULE: ${{ github.workflow }}
  CI_DEPLOY_PLATFORM: ${{ github.job }}
  CI_DEPLOY_SETTINGS: ${{ secrets.CI_DEPLOY_SETTINGS }}
  CI_DEPLOY_USERNAME: ${{ secrets.CI_DEPLOY_USERNAME }}
  CI_DEPLOY_PASSWORD: ${{ secrets.CI_DEPLOY_PASSWORD }}
  STAGING_REPOSITORY: ${{ secrets.STAGING_REPOSITORY }}
jobs:
#  android-arm:
#    runs-on: ubuntu-22.04
#    steps:
#      - uses: devjeonghwan/javacpp-presets/.github/actions/deploy-ubuntu@windows-arm64-base
  android-arm64:
    runs-on: ubuntu-22.04
    steps:
      - uses: devjeonghwan/javacpp-presets/.github/actions/deploy-ubuntu@windows-arm64-base
#  android-x86:
#    runs-on: ubuntu-22.04
#    steps:
#      - uses: devjeonghwan/javacpp-presets/.github/actions/deploy-ubuntu@windows-arm64-base
  android-x86_64:
    runs-on: ubuntu-22.04
    steps:
      - uses: devjeonghwan/javacpp-presets/.github/actions/deploy-ubuntu@windows-arm64-base
  ios-arm64:
    runs-on: macos-15-intel
    steps:
      - uses: devjeonghwan/javacpp-presets/.github/actions/deploy-macosx@windows-arm64-base
  ios-x86_64:
    runs-on: macos-15-intel
    steps:
      - uses: devjeonghwan/javacpp-presets/.github/actions/deploy-macosx@windows-arm64-base
#  linux-armhf:
#    runs-on: ubuntu-22.04
#    steps:
#      - uses: devjeonghwan/javacpp-presets/.github/actions/deploy-ubuntu@windows-arm64-base
  linux-arm64:
    runs-on: ubuntu-22.04
    steps:
      - uses: devjeonghwan/javacpp-presets/.github/actions/deploy-ubuntu@windows-arm64-base
#  linux-ppc64le:
#    runs-on: ubuntu-22.04
#    steps:
#      - uses: devjeonghwan/javacpp-presets/.github/actions/deploy-ubuntu@windows-arm64-base
#  linux-x86:
#    runs-on: ubuntu-22.04
#    steps:
#      - uses: devjeonghwan/javacpp-presets/.github/actions/deploy-ubuntu@windows-arm64-base
  linux-x86_64:
    runs-on: ubuntu-22.04
    steps:
      - uses: devjeonghwan/javacpp-presets/.github/actions/deploy-ubuntu@windows-arm64-base
  macosx-arm64:
    runs-on: macos-15
    steps:
      - uses: devjeonghwan/javacpp-presets/.github/actions/deploy-macosx@windows-arm64-base
  macosx-x86_64:
    runs-on: macos-15-intel
    steps:
      - uses: devjeonghwan/javacpp-presets/.github/actions/deploy-macosx@windows-arm64-base
  windows-arm64:
    runs-on: windows-11-arm
    steps:
      - uses: devjeonghwan/javacpp-presets/.github/actions/deploy-windows@windows-arm64-base
#  windows-x86:
#    runs-on: windows-2022
#    steps:
#      - uses: devjeonghwan/javacpp-presets/.github/actions/deploy-windows@windows-arm64-base
  windows-x86_64:
    runs-on: windows-2022
    steps:
      - uses: devjeonghwan/javacpp-presets/.github/actions/deploy-windows@windows-arm64-base
  platform:
#    needs: [android-arm, android-arm64, android-x86, android-x86_64, ios-arm64, ios-x86_64, linux-armhf, linux-arm64, linux-ppc64le, linux-x86, linux-x86_64, macosx-arm64, macosx-x86_64, windows-x86, windows-x86_64]
    needs: [android-arm64, android-x86_64, ios-arm64, ios-x86_64, linux-arm64, linux-x86_64, macosx-arm64, macosx-x86_64, windows-arm64, windows-x86_64]
    runs-on: ubuntu-22.04
    steps:
      - uses: devjeonghwan/javacpp-presets/.github/actions/redeploy@windows-arm64-base
