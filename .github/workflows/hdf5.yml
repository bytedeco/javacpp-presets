name: hdf5
on:
  push:
    paths:
      - hdf5/**
      - .github/workflows/hdf5.yml
  pull_request:
    paths:
      - hdf5/**
      - .github/workflows/hdf5.yml
  workflow_dispatch:
env:
  CI_DEPLOY_MODULE: ${{ github.workflow }}
  CI_DEPLOY_PLATFORM: ${{ github.job }}
  CI_DEPLOY_SETTINGS: ${{ secrets.CI_DEPLOY_SETTINGS }}
  CI_DEPLOY_USERNAME: ${{ secrets.CI_DEPLOY_USERNAME }}
  CI_DEPLOY_PASSWORD: ${{ secrets.CI_DEPLOY_PASSWORD }}
  STAGING_REPOSITORY: ${{ secrets.STAGING_REPOSITORY }}
jobs:
  android-arm64:
    runs-on: ubuntu-22.04
    env:
      # Cross-compiled for a different CPU architecture and libc (Bionic, not glibc);
      # can't execute the result on this x86_64 host.
      CI_DEPLOY_OPTIONS: -DskipTests=true
    steps:
      # The source archives are downloaded into downloads/ of the workspace by cppbuild.sh. Keep them between runs, so
      # that a flaky download does not fail the build. The key is unique, to save the archives of new versions, and
      # the most recent cache of the same job is restored from its prefix.
      - uses: actions/cache@v4
        with:
          path: downloads
          key: hdf5-downloads-android-arm64-${{ github.sha }}
          restore-keys: hdf5-downloads-android-arm64-
      - uses: bytedeco/javacpp-presets/.github/actions/deploy-ubuntu@actions
      # Android is not tested here, so at least look at what the plugins need at runtime: Bionic has no librt, which
      # Blosc2 asks the linker for, so none of the plugins may depend on it. The other dependencies are only listed.
      - name: Check the dependencies of the plugins
        run: |
          READELF=$(echo android-ndk/toolchains/llvm/prebuilt/*/bin/llvm-readelf)
          status=0
          for f in hdf5/cppbuild/$CI_DEPLOY_PLATFORM/lib/plugin/*.so; do
            echo "== $f"
            "$READELF" --dynamic "$f" | grep NEEDED || true
            if "$READELF" --dynamic "$f" | grep -q 'NEEDED.*librt'; then
              echo "::error::$f depends on librt, which Android does not have"
              status=1
            fi
          done
          if ! ls hdf5/cppbuild/$CI_DEPLOY_PLATFORM/lib/plugin/*.so > /dev/null 2>&1; then
            echo "::error::No plugins were built"
            status=1
          fi
          exit $status
  android-x86_64:
    runs-on: ubuntu-22.04
    env:
      # Same CPU ISA as the host, but a different libc (Bionic) and ABI -- still
      # can't execute the result here.
      CI_DEPLOY_OPTIONS: -DskipTests=true
    steps:
      # The source archives are downloaded into downloads/ of the workspace by cppbuild.sh. Keep them between runs, so
      # that a flaky download does not fail the build. The key is unique, to save the archives of new versions, and
      # the most recent cache of the same job is restored from its prefix.
      - uses: actions/cache@v4
        with:
          path: downloads
          key: hdf5-downloads-android-x86_64-${{ github.sha }}
          restore-keys: hdf5-downloads-android-x86_64-
      - uses: bytedeco/javacpp-presets/.github/actions/deploy-ubuntu@actions
      # Android is not tested here, so at least look at what the plugins need at runtime: Bionic has no librt, which
      # Blosc2 asks the linker for, so none of the plugins may depend on it. The other dependencies are only listed.
      - name: Check the dependencies of the plugins
        run: |
          READELF=$(echo android-ndk/toolchains/llvm/prebuilt/*/bin/llvm-readelf)
          status=0
          for f in hdf5/cppbuild/$CI_DEPLOY_PLATFORM/lib/plugin/*.so; do
            echo "== $f"
            "$READELF" --dynamic "$f" | grep NEEDED || true
            if "$READELF" --dynamic "$f" | grep -q 'NEEDED.*librt'; then
              echo "::error::$f depends on librt, which Android does not have"
              status=1
            fi
          done
          if ! ls hdf5/cppbuild/$CI_DEPLOY_PLATFORM/lib/plugin/*.so > /dev/null 2>&1; then
            echo "::error::No plugins were built"
            status=1
          fi
          exit $status
