name: hdf5
on:
  push:
    paths:
      - hdf5/**
      - .github/workflows/hdf5.yml
  pull_request:
    paths:
      - hdf5/**
      - .github/workflows/hdf5.yml
  workflow_dispatch:
env:
  CI_DEPLOY_MODULE: ${{ github.workflow }}
  CI_DEPLOY_PLATFORM: ${{ github.job }}
  CI_DEPLOY_SETTINGS: ${{ secrets.CI_DEPLOY_SETTINGS }}
  CI_DEPLOY_USERNAME: ${{ secrets.CI_DEPLOY_USERNAME }}
  CI_DEPLOY_PASSWORD: ${{ secrets.CI_DEPLOY_PASSWORD }}
  STAGING_REPOSITORY: ${{ secrets.STAGING_REPOSITORY }}
jobs:
  linux-armhf:
    runs-on: ubuntu-22.04
    env:
      # Genuinely cross-compiled (no armhf GitHub-hosted runner, no QEMU emulator
      # configured), so the resulting binary can't be executed on this x86_64 host at
      # all; HDF5BindingsTest can only run where the native build matches the JVM.
      CI_DEPLOY_OPTIONS: -DskipTests=true
    steps:
      - uses: bytedeco/javacpp-presets/.github/actions/deploy-ubuntu@actions
  linux-arm64:
    runs-on: ubuntu-22.04-arm
    steps:
      - uses: bytedeco/javacpp-presets/.github/actions/deploy-ubuntu@actions
  linux-ppc64le:
    runs-on: ubuntu-22.04
    env:
      # Same reasoning as linux-armhf: cross-compiled, can't execute the result here.
      CI_DEPLOY_OPTIONS: -DskipTests=true
    steps:
      - uses: bytedeco/javacpp-presets/.github/actions/deploy-ubuntu@actions
  linux-x86:
    runs-on: ubuntu-20.04
    container: centos:7
    env:
      # Same 64-bit-only-JVM reasoning as windows-x86: this fleet's JDK can't load a
      # 32-bit native library, so HDF5BindingsTest can't run here either.
      CI_DEPLOY_OPTIONS: -DskipTests=true
    steps:
      - uses: bytedeco/javacpp-presets/.github/actions/deploy-centos@actions
  linux-x86_64:
    runs-on: ubuntu-22.04
    steps:
      - uses: bytedeco/javacpp-presets/.github/actions/deploy-ubuntu@actions
  macosx-arm64:
    runs-on: macos-15
    steps:
      - uses: bytedeco/javacpp-presets/.github/actions/deploy-macosx@actions
  macosx-x86_64:
    runs-on: macos-15-intel
    steps:
      - uses: bytedeco/javacpp-presets/.github/actions/deploy-macosx@actions
  windows-x86:
    runs-on: windows-2022
    env:
      # A 32-bit native build can't be exercised by this fleet's 64-bit-only JVM
      # (HDF5BindingsTest would fail with UnsatisfiedLinkError on the arch mismatch),
      # so skip running tests here; the native artifact is still built and packaged.
      CI_DEPLOY_OPTIONS: -DskipTests=true
    steps:
      - uses: bytedeco/javacpp-presets/.github/actions/deploy-windows@actions
  windows-x86_64:
    runs-on: windows-2022
    steps:
      - uses: bytedeco/javacpp-presets/.github/actions/deploy-windows@actions
  redeploy:
    needs: [linux-armhf, linux-arm64, linux-ppc64le, linux-x86, linux-x86_64, macosx-arm64, macosx-x86_64, windows-x86, windows-x86_64]
#    needs: [linux-armhf, linux-arm64, linux-ppc64le, linux-x86, linux-x86_64, macosx-x86_64, windows-x86, windows-x86_64]
    runs-on: ubuntu-22.04
    steps:
      - uses: bytedeco/javacpp-presets/.github/actions/redeploy@actions
