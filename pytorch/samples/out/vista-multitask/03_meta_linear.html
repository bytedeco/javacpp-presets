    const x=8,y=6,w=NW-16,h=NH-12,cut=14;
    el.setAttribute('points', (x+cut)+','+y+' '+(x+w-cut)+','+y+' '+(x+w)+','+(y+h/2)+' '+(x+w-cut)+','+(y+h)+' '+(x+cut)+','+(y+h)+' '+x+','+(y+h/2));
  } else if(shape==='stadium' || shape==='pill'){
    el=document.createElementNS('http://www.w3.org/2000/svg','rect');
    el.setAttribute('x',2); el.setAttribute('y',2); el.setAttribute('width',NW-4); el.setAttribute('height',NH-4);
    el.setAttribute('rx', shape==='stadium' ? (NH/2-2) : 22); el.setAttribute('ry', shape==='stadium' ? (NH/2-2) : 22);
  } else {
    el=document.createElementNS('http://www.w3.org/2000/svg','rect');
    el.setAttribute('x',1); el.setAttribute('y',1); el.setAttribute('width',NW-2); el.setAttribute('height',NH-2);
    el.setAttribute('rx',16); el.setAttribute('ry',16);
  }
  el.setAttribute('class','card');
  el.setAttribute('fill', st.fill);
  el.setAttribute('stroke', st.stroke);
  el.setAttribute('stroke-width', failed?2.6:1.7);
  g.appendChild(el);
  return el;
}
function render(){
  const vis=visibleNodes(); const edges=layout(vis);
  // clear world
  while(world.firstChild) world.removeChild(world.firstChild);
  const frameLayer=document.createElementNS('http://www.w3.org/2000/svg','g');
  world.appendChild(frameLayer);
  const edgeLayer=document.createElementNS('http://www.w3.org/2000/svg','g');
  world.appendChild(edgeLayer);
  const nodeLayer=document.createElementNS('http://www.w3.org/2000/svg','g');
  world.appendChild(nodeLayer);
  Object.keys(parentToNodes).forEach(c=>{
    if(collapsed.has(c) || isHidden(c)) return;
    const members=(parentToNodes[c]||[]).map(rep).filter(m=>vis.has(m) && pos[m]);
    if(members.length<1) return;
    let minX=1e9,minY=1e9,maxX=-1e9,maxY=-1e9;
    members.forEach(m=>{const p=pos[m]; minX=Math.min(minX,p.x); minY=Math.min(minY,p.y); maxX=Math.max(maxX,p.x+NW); maxY=Math.max(maxY,p.y+NH);});
    const pad=14; const fr=document.createElementNS('http://www.w3.org/2000/svg','rect');
    fr.setAttribute('class','vc-frame');
    fr.setAttribute('x', minX-pad); fr.setAttribute('y', minY-pad-12);
    fr.setAttribute('width', maxX-minX+pad*2); fr.setAttribute('height', maxY-minY+pad*2+12);
    fr.setAttribute('rx',18); fr.setAttribute('ry',18);
    frameLayer.appendChild(fr);
    const tl=document.createElementNS('http://www.w3.org/2000/svg','text');
    tl.setAttribute('class','vc-label'); tl.setAttribute('x', minX-pad+10); tl.setAttribute('y', minY-pad-12+14);
    tl.textContent='📦 '+(labelOf(c)||c); frameLayer.appendChild(tl);
  });
  edges.forEach(e=>{
    const a=pos[e.s], b=pos[e.t]; if(!a||!b) return;
    const x1=a.x+NW, y1=a.y+NH/2, x2=b.x, y2=b.y+NH/2, mx=(x1+x2)/2;
    const p=document.createElementNS('http://www.w3.org/2000/svg','path');
    p.setAttribute('class','ve'+(e.implied?' implied':''));
    p.setAttribute('d','M'+x1+','+y1+' C'+mx+','+y1+' '+mx+','+y2+' '+x2+','+y2);
    p.setAttribute('data-s', e.s); p.setAttribute('data-t', e.t);
    edgeLayer.appendChild(p);
    if(e.dims){
      const lx=mx, ly=(y1+y2)/2 - 8;
      const bg=document.createElementNS('http://www.w3.org/2000/svg','rect');
      const tw=Math.min(110, 8+e.dims.length*6.2);
      bg.setAttribute('class','ve-label-bg'); bg.setAttribute('x', lx-tw/2); bg.setAttribute('y', ly-10);
      bg.setAttribute('width', tw); bg.setAttribute('height', 16); edgeLayer.appendChild(bg);
      const t=document.createElementNS('http://www.w3.org/2000/svg','text');
      t.setAttribute('class','ve-label'); t.setAttribute('x', lx); t.setAttribute('y', ly+2);
      t.setAttribute('text-anchor','middle'); t.textContent=e.dims; edgeLayer.appendChild(t);
    }
  });
  let idx=0;
  vis.forEach(n=>{
    const p=pos[n]; if(!p) return;
    const g=document.createElementNS('http://www.w3.org/2000/svg','g');
    g.setAttribute('class','vn pop'+(selectedName===n?' selected':''));
    g.style.animationDelay=(Math.min(idx,16)*0.025)+'s';
    // CRITICAL: set SVG transform attribute — do not use CSS transform on this element
    g.setAttribute('transform','translate('+p.x+','+p.y+')');
    g.setAttribute('data-node', n);
    const failed=!!(adj[n]&&adj[n].failed);
    if(failed) g.classList.add('failed');
    const st=styleOf(n, failed);
    drawShape(g, st, failed);
    if((st.shape==='round'||st.shape==='pill'||st.shape==='stadium')){
      const tick=document.createElementNS('http://www.w3.org/2000/svg','rect');
      tick.setAttribute('x',6); tick.setAttribute('y',14); tick.setAttribute('width',4); tick.setAttribute('height',NH-28);
      tick.setAttribute('rx',2); tick.setAttribute('fill', st.badge); g.appendChild(tick);
    }
    const br=document.createElementNS('http://www.w3.org/2000/svg','rect');
    br.setAttribute('x',14); br.setAttribute('y',8); br.setAttribute('width',44); br.setAttribute('height',15);
    br.setAttribute('rx',8); br.setAttribute('fill', st.badge); g.appendChild(br);
    const bt=document.createElementNS('http://www.w3.org/2000/svg','text');
    bt.setAttribute('class','badge'); bt.setAttribute('x',36); bt.setAttribute('y',19);
    bt.setAttribute('text-anchor','middle'); bt.setAttribute('fill','#fff'); bt.textContent=st.badgeText; g.appendChild(bt);
    const t1=document.createElementNS('http://www.w3.org/2000/svg','text');
    t1.setAttribute('class','t1'); t1.setAttribute('x',14); t1.setAttribute('y',38);
    const lab=(st.emoji?st.emoji+' ':'')+labelOf(n);
    t1.textContent=lab.length>20?lab.slice(0,19)+'…':lab; g.appendChild(t1);
    const od=primaryDim(outDims(n)) || primaryDim(inDims(n));
    const id=primaryDim(inDims(n));
    let shapeTxt='';
    if(id && od && id!==od) shapeTxt=id+' → '+od;
    else if(od) shapeTxt='out '+od;
    else if(id) shapeTxt='in '+id;
    const t3=document.createElementNS('http://www.w3.org/2000/svg','text');
    t3.setAttribute('class','t3'); t3.setAttribute('x',14); t3.setAttribute('y',52);
    t3.textContent=shapeTxt || typeOf(n); g.appendChild(t3);
    const hl=hyperLine(n);
    const t2=document.createElementNS('http://www.w3.org/2000/svg','text');
    t2.setAttribute('class','t2'); t2.setAttribute('x',14); t2.setAttribute('y',64);
    let sub=hl || (collapsed.has(n)?'collapsed · tap +': (containers.has(n)&& (parentToNodes[n]||[]).length ? 'group · tap −' : familyOf(n)));
    if(failed) sub='FAILED · '+sub;
    t2.textContent=sub.length>28?sub.slice(0,27)+'…':sub; g.appendChild(t2);
    const members=parentToNodes[n]||childrenOf[n]||[];
    if(members.length||collapsed.has(n)){
      const pm=document.createElementNS('http://www.w3.org/2000/svg','text');
      pm.setAttribute('class','pm'); pm.setAttribute('x',NW-12); pm.setAttribute('y',22);
      pm.setAttribute('text-anchor','end'); pm.textContent=collapsed.has(n)?'＋':'－'; g.appendChild(pm);
    }
    enableDrag(g,n);
    g.addEventListener('click',ev=>{ev.stopPropagation(); onClick(n,g);});
    nodeLayer.appendChild(g);
    idx++;
  });
  applyT();
  updateStats(vis, edges);
  updateLegend(vis);
}
function updateStats(vis, edges){
  const nN=vis.size, nE=edges.length;
  const ops=[...vis].filter(n=>typeOf(n)==='Operation').length;
  const mods=[...vis].filter(n=>typeOf(n)==='Module').length;
  statsEl.innerHTML='<span class="vx-stat">nodes<b>'+nN+'</b></span>'+
    '<span class="vx-stat">edges<b>'+nE+'</b></span>'+
    '<span class="vx-stat">modules<b>'+mods+'</b></span>'+
    '<span class="vx-stat">ops<b>'+ops+'</b></span>';
}
function updateLegend(vis){
  const seen=new Set(); const bits=[];
  vis.forEach(n=>{const f=familyOf(n); if(seen.has(f))return; seen.add(f);
    const st=FAMILY[f]||FAMILY.module;
    bits.push('<span class="vx-leg" style="border-color:'+st.stroke+';background:'+st.fill+'">'+st.emoji+' '+f+'</span>');});
  legendEl.innerHTML=bits.join('');
}
function onClick(n,g){
  const members=parentToNodes[n]||childrenOf[n]||[];
  if(members.length||collapsed.has(n)){
    if(collapsed.has(n)) collapsed.delete(n); else collapsed.add(n);
    Object.keys(pos).forEach(k=>{if(pos[k])pos[k]._auto=true;});
    selectedName=n; render(); 
    // re-find node after re-render
    const ng=world.querySelector('g[data-node="'+CSS.escape(n)+'"]');
    if(ng){ ng.classList.add('selected','pulse'); selected=ng; }
  } else {
    if(selected) selected.classList.remove('selected','pulse');
    selected=g; selectedName=n; g.classList.add('selected','pulse');
  }
  highlightEdges(n);
  showInfo(n);
}
function highlightEdges(n){
  world.querySelectorAll('path.ve').forEach(p=>{
    const s=p.getAttribute('data-s'), t=p.getAttribute('data-t');
    if(s===n||t===n) p.classList.add('hi'); else p.classList.remove('hi');
  });
}
function showInfo(n){
  const st=styleOf(n, !!(adj[n]&&adj[n].failed));
  dtitle.textContent=(st.emoji||'✨')+' '+labelOf(n);
  dchips.innerHTML='';
  const chips=[typeOf(n), familyOf(n), bareNames[n]||'', attrNames[n]?('#'+attrNames[n]):''].filter(Boolean);
  if(adj[n]&&adj[n].failed) chips.push('FAILED');
  if(collapsed.has(n)) chips.push('collapsed');
  chips.forEach(c=>{const s=document.createElement('span'); s.className='vx-chip'; s.textContent=c; dchips.appendChild(s);});
  dshapes.innerHTML='';
  const id=inDims(n), od=outDims(n);
  if(id.length){const p=document.createElement('div'); p.className='vx-shape-pill'; p.textContent='in  '+[...new Set(id)].join(' | '); dshapes.appendChild(p);}
  if(od.length){const p=document.createElement('div'); p.className='vx-shape-pill'; p.textContent='out '+[...new Set(od)].join(' | '); dshapes.appendChild(p);}
  const lines=[];
  lines.push('id: '+n);
  lines.push('type: '+typeOf(n)+' · family: '+familyOf(n));
  if(pathMap[n]) lines.push('path: '+pathMap[n]);
  if(ancestorMap[n]) lines.push('parent: '+ancestorMap[n]+' ('+labelOf(ancestorMap[n])+')');
  if(moduleInfo[n]){
    lines.push(''); lines.push('—— module ——');
    const mi=moduleInfo[n];
    if(mi.type) lines.push('class: '+mi.type);
    if(mi.attributes && Object.keys(mi.attributes).length){
      lines.push('attributes:');
      Object.keys(mi.attributes).forEach(k=>lines.push('  '+k+': '+JSON.stringify(mi.attributes[k])));
    }
    if(mi.parameters && Object.keys(mi.parameters).length){
      lines.push('parameters:');
      Object.keys(mi.parameters).forEach(k=>{
        const p=mi.parameters[k];
        lines.push('  '+k+': shape='+JSON.stringify(p.shape||[])+' requires_grad='+!!p.requires_grad);
      });
    }
    if(mi.extra_repr) lines.push('extra: '+mi.extra_repr);
  }
  if(funcInfo[n]){
    lines.push(''); lines.push('—— call args ——');
    lines.push(JSON.stringify(funcInfo[n], null, 2));
  }
  if(!moduleInfo[n]&&!funcInfo[n]) lines.push('\n(no module_info / func_info for this node)');
  dbody.textContent=lines.join('\n');
}
document.getElementById('dclose-'+ID).onclick=()=>{
  dtitle.textContent='✨ Inspector'; dchips.innerHTML=''; dshapes.innerHTML='';
  dbody.textContent='点一下节点看看超参和 shape 吧 💕';
  if(selected){selected.classList.remove('selected','pulse'); selected=null; selectedName=null;}
  world.querySelectorAll('path.ve.hi').forEach(p=>p.classList.remove('hi'));
};
function enableDrag(g,n){
  let dragging=false, ox=0, oy=0;
  g.addEventListener('pointerdown',ev=>{
    if(ev.button!==0)return; dragging=true; g.setPointerCapture(ev.pointerId);
    ox=ev.clientX; oy=ev.clientY; ev.stopPropagation();
  });
  g.addEventListener('pointermove',ev=>{
    if(!dragging)return;
    const dx=(ev.clientX-ox)/transform.k, dy=(ev.clientY-oy)/transform.k;
    ox=ev.clientX; oy=ev.clientY;
    pos[n].x+=dx; pos[n].y+=dy; pos[n]._auto=false;
    // live update this node + re-render edges for correctness
    render();
    const ng=world.querySelector('g[data-node="'+CSS.escape(n)+'"]');
    if(ng){ selected=ng; selectedName=n; ng.classList.add('selected'); }
  });
  g.addEventListener('pointerup',()=>{dragging=false;});
}
let panning=false, px=0, py=0;
svg.addEventListener('pointerdown',ev=>{ if(ev.button!==0)return; panning=true; px=ev.clientX; py=ev.clientY; svg.setPointerCapture(ev.pointerId); });
svg.addEventListener('pointermove',ev=>{ if(!panning)return; transform.x+=ev.clientX-px; transform.y+=ev.clientY-py; px=ev.clientX; py=ev.clientY; applyT(); });
svg.addEventListener('pointerup',()=>{panning=false;});
svg.addEventListener('wheel',ev=>{
  ev.preventDefault();
  const rect=svg.getBoundingClientRect(); const mx=ev.clientX-rect.left, my=ev.clientY-rect.top;
  const scale=ev.deltaY<0?1.12:1/1.12;
  const nk=Math.min(3.5, Math.max(0.12, transform.k*scale));
  transform.x=mx-(mx-transform.x)*(nk/transform.k);
  transform.y=my-(my-transform.y)*(nk/transform.k);
  transform.k=nk; applyT();
},{passive:false});
function fit(){
  const vis=visibleNodes(); let minX=1e9,minY=1e9,maxX=-1e9,maxY=-1e9, any=false;
  vis.forEach(n=>{const p=pos[n]; if(!p)return; any=true; minX=Math.min(minX,p.x); minY=Math.min(minY,p.y); maxX=Math.max(maxX,p.x+NW); maxY=Math.max(maxY,p.y+NH);});
  if(!any){transform={x:28,y:36,k:1}; applyT(); return;}
  const pad=56; const w=Math.max(100, stage.clientWidth-pad*2), h=Math.max(100, stage.clientHeight-pad*2);
  const bw=Math.max(1,maxX-minX), bh=Math.max(1,maxY-minY);
  const k=Math.min(w/bw, h/bh, 1.55);
  transform.k=k;
  transform.x=pad - minX*k + (w-bw*k)/2;
  transform.y=pad - minY*k + (h-bh*k)/2;
  applyT();
}
document.getElementById('fit-'+ID).onclick=()=>fit();
document.getElementById('exp-'+ID).onclick=()=>{collapsed.clear(); Object.keys(pos).forEach(k=>{if(pos[k])pos[k]._auto=true;}); render(); fit();};
document.getElementById('col-'+ID).onclick=()=>{collapsed.clear(); containers.forEach(c=>{const m=parentToNodes[c]||[]; if(m.length&&containerDepth(c)>0)collapsed.add(c);}); Object.keys(pos).forEach(k=>{if(pos[k])pos[k]._auto=true;}); render(); fit();};
document.getElementById('rst-'+ID).onclick=()=>{Object.keys(pos).forEach(k=>delete pos[k]); selected=null; selectedName=null; render(); fit();};
document.getElementById('theme-'+ID).onclick=()=>{const cur=document.body.getAttribute('data-theme')==='dark'?'light':'dark'; document.body.setAttribute('data-theme',cur);};
render(); fit();
// re-fit on resize
window.addEventListener('resize', ()=>{ fit(); });
})();

</script></body></html>
