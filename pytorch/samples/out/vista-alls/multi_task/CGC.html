    const {row, depth, crossSpan}=placed[l];

function enableDrag(g,n){
  let dragging=false, ox=0, oy=0, moved=false;
  g.addEventListener('pointerdown',ev=>{
    if(ev.button!==0)return; dragging=true; moved=false;
    g.setPointerCapture(ev.pointerId); ox=ev.clientX; oy=ev.clientY; ev.stopPropagation();
  });
  g.addEventListener('pointermove',ev=>{
    if(!dragging)return;
    const dx=(ev.clientX-ox)/transform.k, dy=(ev.clientY-oy)/transform.k;
    if(Math.abs(dx)+Math.abs(dy)<0.5 && !moved) return;
    moved=true; ox=ev.clientX; oy=ev.clientY;
    pos[n].x+=dx; pos[n].y+=dy; pos[n]._auto=false;
    g.setAttribute('transform','translate('+pos[n].x+','+pos[n].y+')');
    liveUpdateEdges();
  });
  g.addEventListener('pointerup',()=>{
    if(!dragging)return; dragging=false;
    if(moved){ render(); const ng=world.querySelector('g[data-node="'+CSS.escape(n)+'"]');
      if(ng){ selected=ng; selectedName=n; ng.classList.add('selected'); } }
  });

function liveUpdateEdges(){
  const edgeLayer=world.children[1]; if(!edgeLayer) return;
  const paths=edgeLayer.querySelectorAll('path.ve, path.ve-base');
  // group by s->t so base+flow share the same geometry
  const seen=new Set();
  paths.forEach(p=>{
    const sN=p.getAttribute('data-s'), tN=p.getAttribute('data-t');
    if(!sN||!tN) return;
    const a=pos[sN], b=pos[tN]; if(!a||!b) return;
    const ep=edgePath(a,b);
    p.setAttribute('d', ep.d);
    // move dim label once per edge pair
    const key=sN+'->'+tN; if(seen.has(key)) return; seen.add(key);
    // labels are siblings after the flow path — find nearby text with matching mid
  });
  // reposition dim labels: walk children, pair consecutive label-bg + label after paths
  const kids=Array.from(edgeLayer.children);
  for(let i=0;i<kids.length;i++){
    const el=kids[i];
    if(el.classList&&el.classList.contains('ve')&&el.getAttribute('data-s')){
      const a=pos[el.getAttribute('data-s')], b=pos[el.getAttribute('data-t')];
      if(!a||!b) continue;
      const ep=edgePath(a,b);
      // next two siblings may be label-bg + label
      const bg=kids[i+1], tx=kids[i+2];
      if(bg&&bg.classList&&bg.classList.contains('ve-label-bg')&&tx&&tx.classList&&tx.classList.contains('ve-label')){
        const tw=parseFloat(bg.getAttribute('width')||'40');
        bg.setAttribute('x', ep.mx-tw/2); bg.setAttribute('y', ep.my-10);
        tx.setAttribute('x', ep.mx); tx.setAttribute('y', ep.my+1);
      }
    }
  }
}
let panning=false, px=0, py=0;
svg.addEventListener('pointerdown',ev=>{if(ev.button!==0)return; panning=true; px=ev.clientX; py=ev.clientY; svg.setPointerCapture(ev.pointerId);});

svg.addEventListener('wheel',ev=>{
  ev.preventDefault();
  const rect=svg.getBoundingClientRect(); const mx=ev.clientX-rect.left, my=ev.clientY-rect.top;
  const scale=ev.deltaY<0?1.12:1/1.12;
  const nk=Math.min(3.5, Math.max(0.12, transform.k*scale));
  transform.x=mx-(mx-transform.x)*(nk/transform.k);
  transform.y=my-(my-transform.y)*(nk/transform.k);
  transform.k=nk; applyT();
},{passive:false});
function fit(){
  const vis=visibleNodes(); let minX=1e9,minY=1e9,maxX=-1e9,maxY=-1e9, any=false;
  vis.forEach(n=>{const p=pos[n]; if(!p)return; any=true; minX=Math.min(minX,p.x); minY=Math.min(minY,p.y); maxX=Math.max(maxX,p.x+NW); maxY=Math.max(maxY,p.y+NH);});
  if(!any){transform={x:28,y:36,k:1}; applyT(); return;}
  const pad=52; const w=Math.max(100, stage.clientWidth-pad*2), h=Math.max(100, stage.clientHeight-pad*2);
  const bw=Math.max(1,maxX-minX), bh=Math.max(1,maxY-minY);
  const k=Math.min(w/bw, h/bh, 1.5);
  transform.k=k; transform.x=pad-minX*k+(w-bw*k)/2; transform.y=pad-minY*k+(h-bh*k)/2; applyT();
}
function zoomBy(factor){
  const rect=svg.getBoundingClientRect(); const mx=rect.width/2, my=rect.height/2;
  const nk=Math.min(3.5, Math.max(0.12, transform.k*factor));
  transform.x=mx-(mx-transform.x)*(nk/transform.k);
  transform.y=my-(my-transform.y)*(nk/transform.k);
  transform.k=nk; applyT();
}

function exportSvgString(){
  const vis=visibleNodes();
  let minX=1e9,minY=1e9,maxX=-1e9,maxY=-1e9;
  vis.forEach(n=>{const p=pos[n]; if(!p)return; minX=Math.min(minX,p.x); minY=Math.min(minY,p.y); maxX=Math.max(maxX,p.x+NW); maxY=Math.max(maxY,p.y+NH);});
  if(minX>maxX){minX=0;minY=0;maxX=800;maxY=600;}
  const pad=48;
  const vbX=minX-pad, vbY=minY-pad, vbW=maxX-minX+pad*2, vbH=maxY-minY+pad*2;
  // Build a fresh SVG from the LIVE world, inlining computed styles
  const ns='http://www.w3.org/2000/svg';
  const out=document.createElementNS(ns,'svg');
  out.setAttribute('xmlns', ns);
  out.setAttribute('viewBox', vbX+' '+vbY+' '+vbW+' '+vbH);
  out.setAttribute('width', String(Math.max(400, Math.round(vbW))));
  out.setAttribute('height', String(Math.max(300, Math.round(vbH))));
  const cs=getComputedStyle(document.body);
  const bg=cs.getPropertyValue('--bg2').trim()||'#ffffff';
  const bgRect=document.createElementNS(ns,'rect');
  bgRect.setAttribute('x', String(vbX)); bgRect.setAttribute('y', String(vbY));
  bgRect.setAttribute('width', String(vbW)); bgRect.setAttribute('height', String(vbH));
  bgRect.setAttribute('fill', bg); out.appendChild(bgRect);
  const liveDefs=svg.querySelector('defs');
  if(liveDefs){
    const defs=liveDefs.cloneNode(true);
    // bake arrow fill
    defs.querySelectorAll('path').forEach(p=>{
      const acc=cs.getPropertyValue('--accent').trim()||'#6366f1';
      p.setAttribute('fill', acc); p.removeAttribute('class');
    });
    out.appendChild(defs);
  }
  const gRoot=document.createElementNS(ns,'g');
  function bake(el){
    // deep-clone one live element with computed presentation attrs
    const tag=el.tagName;
    if(tag==='g'){
      const g=document.createElementNS(ns,'g');
      const tr=el.getAttribute('transform'); if(tr) g.setAttribute('transform', tr);
      Array.from(el.children).forEach(ch=>g.appendChild(bake(ch)));
      return g;
    }
    const neo=document.createElementNS(ns, tag);
    // copy geometry attributes
    ['d','x','y','x1','y1','x2','y2','cx','cy','r','rx','ry','width','height','points','text-anchor','marker-end','stroke-dasharray','stroke-width','font-size','font-weight','font-family'].forEach(a=>{
      const v=el.getAttribute(a); if(v!=null) neo.setAttribute(a,v);
    });
    // inline computed paint — critical for export fidelity
    try{
      const st=getComputedStyle(el);
      const fill=st.fill; if(fill && fill!=='none' && fill!=='rgba(0, 0, 0, 0)') neo.setAttribute('fill', fill);
      else if(el.getAttribute('fill')) neo.setAttribute('fill', el.getAttribute('fill'));
      const stroke=st.stroke; if(stroke && stroke!=='none') neo.setAttribute('stroke', stroke);
      else if(el.getAttribute('stroke')) neo.setAttribute('stroke', el.getAttribute('stroke'));
      const sw=st.strokeWidth; if(sw) neo.setAttribute('stroke-width', sw);
      const op=st.opacity; if(op && op!=='1') neo.setAttribute('opacity', op);
      if(tag==='text'){
        neo.setAttribute('font-size', st.fontSize||'12px');
        neo.setAttribute('font-weight', st.fontWeight||'700');
        neo.setAttribute('font-family', st.fontFamily||'sans-serif');
        if(fill && fill!=='none') neo.setAttribute('fill', fill);
        else neo.setAttribute('fill', cs.getPropertyValue('--ink').trim()||'#1f2937');
      }
      if(tag==='path'){
        // freeze animation for static export; dual-layer: base solid + flow dashed
        neo.setAttribute('fill','none');
        const acc=cs.getPropertyValue('--accent').trim()||'#6366f1';
        const isBase=el.classList.contains('ve-base');
        const isFlow=el.classList.contains('ve');
        if(!neo.getAttribute('stroke') || (stroke&&stroke.indexOf('url(')===0))
          neo.setAttribute('stroke', acc);
        if(isBase){
          neo.setAttribute('stroke-width', '1.4');
          neo.setAttribute('opacity', el.classList.contains('implied')?'0.12':'0.35');
          if(el.classList.contains('implied')) neo.setAttribute('stroke-dasharray','2 5');
          else neo.removeAttribute('stroke-dasharray');
        } else if(isFlow){
          neo.setAttribute('stroke-width', sw||'2.4');
          neo.setAttribute('stroke-linecap','round');
          const me=el.getAttribute('marker-end'); if(me) neo.setAttribute('marker-end', me);
          neo.setAttribute('stroke-dasharray', el.classList.contains('implied')?'2 5':'8 7');
          neo.setAttribute('opacity', el.classList.contains('implied')?'0.5':'0.95');
        } else {
          neo.setAttribute('stroke-width', sw||'2.2');
          neo.setAttribute('stroke-linecap','round');
          const me=el.getAttribute('marker-end'); if(me) neo.setAttribute('marker-end', me);
        }
      }
    }catch(err){}
    if(tag==='text') neo.textContent=el.textContent||'';
    Array.from(el.children).forEach(ch=>neo.appendChild(bake(ch)));
    return neo;
  }
  // bake each top-level layer under live world (no pan/zoom transform)
  Array.from(world.children).forEach(ch=>gRoot.appendChild(bake(ch)));
  out.appendChild(gRoot);
  return '<?xml version="1.0" encoding="UTF-8"?>\n'+new XMLSerializer().serializeToString(out);
}

function exportRaster(mime, filename, quality){
  const str=exportSvgString();
  const img=new Image();
  const url=URL.createObjectURL(new Blob([str],{type:'image/svg+xml;charset=utf-8'}));
  img.onload=function(){
    const scale=2; const canvas=document.createElement('canvas');
    canvas.width=Math.max(1, img.width*scale); canvas.height=Math.max(1, img.height*scale);
    const ctx=canvas.getContext('2d');
    const cs=getComputedStyle(document.body);
    ctx.fillStyle=cs.getPropertyValue('--bg2').trim()||'#ffffff';
    ctx.fillRect(0,0,canvas.width,canvas.height);
    ctx.drawImage(img,0,0,canvas.width,canvas.height);
    canvas.toBlob(function(blob){ if(blob){ downloadBlob(blob, filename); toast('已导出 '+filename); } URL.revokeObjectURL(url); }, mime, quality||0.92);
  };
  img.onerror=function(){ toast('导出失败'); URL.revokeObjectURL(url); };
  img.src=url;
}
function exportPdf(){
  // 1) Expand all modules so the full structure is visible
  collapsed.clear();
  Object.keys(pos).forEach(k=>{ if(pos[k] && pos[k]._auto!==false){ /* keep pins */ } else if(pos[k]) pos[k]._auto=true; });
  // Only auto-relayout unpinned nodes
  Object.keys(pos).forEach(k=>{ if(pos[k] && pos[k]._auto!==false) pos[k]._auto=true; });
  render();
  // 2) Fit + center the full graph in the stage (and for print layout)
  fit();
  // 3) Also size the SVG viewBox to the content bbox so print/PDF captures everything
  try {
    const vis=visibleNodes();
    let minX=1e9,minY=1e9,maxX=-1e9,maxY=-1e9, any=false;
    vis.forEach(n=>{const p=pos[n]; if(!p)return; any=true;
      minX=Math.min(minX,p.x); minY=Math.min(minY,p.y);
      maxX=Math.max(maxX,p.x+NW); maxY=Math.max(maxY,p.y+NH);});
    if(any){
      const pad=48;
      const vbX=minX-pad, vbY=minY-pad, vbW=maxX-minX+pad*2, vbH=maxY-minY+pad*2;
      // Temporarily set viewBox so print captures the full graph centered
      svg.setAttribute('data-prev-viewbox', svg.getAttribute('viewBox')||'');
      svg.setAttribute('viewBox', vbX+' '+vbY+' '+vbW+' '+vbH);
      svg.setAttribute('width', String(Math.max(600, Math.round(vbW))));
      svg.setAttribute('height', String(Math.max(400, Math.round(vbH))));
      // Reset pan/zoom so world is identity under the viewBox
      transform={x:0,y:0,k:1}; applyT();
    }
  } catch(err) { console.warn(err); }
  toast('PDF：已展开并居中全图，请在打印框选择「存储为 PDF」');
  const restore=()=>{
    const prev=svg.getAttribute('data-prev-viewbox');
    if(prev) svg.setAttribute('viewBox', prev); else svg.removeAttribute('viewBox');
    svg.removeAttribute('data-prev-viewbox');
    svg.style.width=''; svg.style.height='';
    svg.setAttribute('width','100%'); svg.removeAttribute('height');
    fit();
    window.removeEventListener('afterprint', restore);
  };
  window.addEventListener('afterprint', restore);
  setTimeout(()=>window.print(), 500);
}

['cute','dark','office'].forEach(t=>{ const b=document.getElementById('th-'+t+'-'+ID); if(b) b.onclick=()=>setTheme(t); });
const expBtn=document.getElementById('export-'+ID);
expBtn.onclick=(ev)=>{ ev.stopPropagation(); exportMenu.hidden=!exportMenu.hidden; };
document.addEventListener('click',()=>{ exportMenu.hidden=true; });
exportMenu.querySelectorAll('button').forEach(b=>{
  b.onclick=(ev)=>{ ev.stopPropagation(); exportMenu.hidden=true;
    const f=b.getAttribute('data-fmt');
    if(f==='svg') exportSvg();
    else if(f==='png') exportRaster('image/png','vista_graph.png');
    else if(f==='jpeg') exportRaster('image/jpeg','vista_graph.jpg',0.92);
    else if(f==='pdf') exportPdf();
  };
});
render(); fit();
window.addEventListener('resize', ()=>fit());
})();

</script></body></html>
